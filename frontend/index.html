<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook - log in or sign up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="top-bar">
    <a href="login.html" class="btn btn-outline">Log In</a>
    <a href="signup.html" class="btn btn-primary">Create Account</a>
  </div>

  <main class="landing-wrap">
    <section class="landing-intro">
      <div class="wordmark">facebook</div>
      <p>Connect with friends and the world around you.</p>
    </section>

    <section class="landing-form-col">
      <div class="card">
        <form id="quick-login-form" action="login.html" method="get">
          <input type="text" id="email" name="email" placeholder="Email address or phone number" required />
          <input type="password" id="password" name="password" placeholder="Password" required />
          <div class="center-btn-wrap">
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
          </div>
          <a href="#" class="forgot-link" style="margin-top:14px;">Forgotten password?</a>
          <hr class="divider" />
          <div class="center-btn-wrap">
            <a href="signup.html" class="btn btn-green">Create New Account</a>
          </div>
        </form>
      </div>
      <p class="small-print">
        <strong>Create a Page</strong> for a celebrity, brand or business.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    FacebookNgMgagalit &middot; OSPV PRODUCTIONS &middot; &copy; 2026
  </footer>

  <script src="script.js"></script>
</body>
</html>
